name: iOS build

# Ember for iPhone was written on Windows and has never been compiled: iOS
# builds only on macOS. This workflow is the substitute for a Mac. It doesn't
# sign anything and it can't run the app — it answers the one question that
# can't be answered from Windows: does all of this actually build?
#
# macOS runners are free on public repositories, so this costs nothing.

on:
  push:
    branches: [ios]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [ios]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that already passes on Windows, re-checked on Linux in seconds.
  # If this fails, the macOS job below was never going to work either.
  web:
    name: Types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npx vitest run

      - name: Build the web bundle
        run: npm run build

  ios:
    name: Compile for iPhone
    needs: web
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Which Xcode and SDK
        run: |
          xcodebuild -version
          echo "iphoneos SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Build the web bundle
        run: npm run build

      # ---- 1. The Rust core, including src-tauri/src/ios_extras.rs ----
      # The part most likely to be wrong, and the cheapest to find out about.
      # None of it had ever seen the iOS SDK.
      - name: Compile the Rust core for iOS
        working-directory: src-tauri
        run: cargo build --lib --target aarch64-apple-ios

      # ---- 2. The loose Swift files in ios/ ----
      # These are not in the Xcode project: their targets are added by hand on
      # a Mac (BUILDING-ON-A-MAC.md). Typechecking them here is the only way a
      # compiler looks at them at all.
      - name: Typecheck the Swift that isn't in the project yet
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          # Each group is checked at the deployment target its real Xcode
          # target will have: EmberWidget is iOS 17, because from iOS 17 a
          # widget has to declare its own background.
          check() {
            local name="$1"; local min="$2"; shift 2
            echo "::group::$name (iOS $min)"
            xcrun --sdk iphoneos swiftc -typecheck -parse-as-library \
              -sdk "$SDK" -target "arm64-apple-ios$min" "$@"
            echo "::endgroup::"
          }
          check "app target" 16.0 \
            ios/Shared/EmberInbox.swift \
            ios/Shared/EmberIntents.swift
          # The app's own native piece is Objective-C++, not Swift: a Tauri
          # iOS app has no AppDelegate, so the App Group path is handed to
          # Rust from a +load method instead (ios/App/EmberBootstrap.mm).
          echo "::group::app target, Objective-C++ (iOS 16.0)"
          xcrun --sdk iphoneos clang -fsyntax-only -fobjc-arc -x objective-c++ \
            -isysroot "$SDK" -target arm64-apple-ios16.0 ios/App/EmberBootstrap.mm
          echo "::endgroup::"
          check "EmberWidget target (widget + Control Centre)" 17.0 \
            ios/Shared/EmberInbox.swift \
            ios/Shared/EmberIntents.swift \
            ios/EmberWidget/EmberWidget.swift
          check "EmberShare target (share sheet)" 16.0 \
            ios/Shared/EmberInbox.swift \
            ios/EmberShare/ShareViewController.swift

      # ---- 3. The Xcode project ----
      # Not committed: cargo-mobile2 generates it. This step proves
      # `tauri ios init` works against this config at all.
      - name: Generate the Xcode project
        run: npx tauri ios init --ci --skip-targets-install

      # The two keys that put "Ember backup.db" in the Files app. There is no
      # URL scheme to declare: the widget, the Control Centre button and the
      # Shortcuts action all run an App Intent, which writes its line to the
      # inbox before Ember even opens.
      - name: Add the Info.plist keys Ember needs
        run: |
          set -euo pipefail
          PLIST="$(find src-tauri/gen/apple -maxdepth 2 -name 'Info.plist' | head -1)"
          echo "Info.plist: $PLIST"
          p() { /usr/libexec/PlistBuddy -c "$1" "$PLIST" 2>/dev/null || true; }
          # Backups show up in Files > On My iPhone > Ember.
          p "Delete :UIFileSharingEnabled"
          p "Add :UIFileSharingEnabled bool true"
          p "Delete :LSSupportsOpeningDocumentsInPlace"
          p "Add :LSSupportsOpeningDocumentsInPlace bool true"
          /usr/libexec/PlistBuddy -c "Print" "$PLIST"

      # ---- 3b. The widget and the share sheet, as real targets ----
      #
      # `tauri ios init` doesn't hand-write an .xcodeproj: it writes an
      # XcodeGen spec, project.yml, and generates the project from that. So
      # everything that used to need someone clicking around in Xcode - two
      # app-extension targets, an App Group on each, and embedding them in the
      # app - is a patch to that YAML. Which means a build server can do it,
      # and can check that it worked.
      - name: Add the widget and share-sheet targets
        run: |
          set -euo pipefail
          brew install xcodegen
          python3 -m pip install --quiet --break-system-packages pyyaml             || python3 -m pip install --quiet pyyaml
          python3 scripts/xcode-extensions.py
          echo "::group::project.yml"
          cat src-tauri/gen/apple/project.yml
          echo "::endgroup::"
          cd src-tauri/gen/apple && xcodegen generate --spec project.yml

      # ---- 4. Swift, the Rust static library, and linking ----
      #
      # This has to go through Tauri's own command, not a bare xcodebuild: the
      # "Build Rust Code" phase inside the generated project calls back into
      # `tauri ios xcode-script`, which reads options the CLI writes to a temp
      # file first. Run xcodebuild directly and that phase panics on the
      # missing file, whatever configuration is asked for.
      #
      # The simulator target is what makes this work without an Apple account:
      # a simulator build is never code-signed. A device build is the same
      # Swift and the same Rust, and step 1 above already compiles that Rust
      # for a real iPhone, so what is left unproven here is only the signing.
      - name: Build for the iOS Simulator (no signing needed)
        run: npx tauri ios build --ci --verbose --target aarch64-sim

      - name: Find the built app, and check the extensions are inside it
        run: |
          set -euo pipefail
          APP="$(find src-tauri/gen/apple -name '*.app' -type d | grep -i sim | head -1)"
          if [ -z "$APP" ]; then APP="$(find src-tauri/gen/apple -name '*.app' -type d | head -1)"; fi
          echo "App: $APP"
          test -n "$APP"
          echo "::group::what is in the app bundle"
          ls -la "$APP"
          ls -la "$APP/PlugIns" 2>/dev/null || echo "(no PlugIns folder)"
          echo "::endgroup::"
          # An extension that didn't get embedded is one that will never show
          # up on the Home Screen or in the share sheet.
          test -d "$APP/PlugIns/EmberWidget.appex"
          test -d "$APP/PlugIns/EmberShare.appex"
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=dev.abhij.ember.ios" >> "$GITHUB_ENV"

      # ---- 5. Actually run it ----
      #
      # Compiling says nothing about whether the thing starts. Booting a
      # simulator here is what turns "it builds" into "it runs": the webview
      # loads, the React app mounts, tauri-plugin-sql opens ember.db and puts
      # all fourteen migrations through it. None of that had ever happened.
      - name: Boot a simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          UDID="$(python3 scripts/pick-simulator.py)"
          test -n "$UDID"
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Install and launch Ember
        run: |
          set -euo pipefail
          mkdir -p shots
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          # The webview, the React bundle and fourteen migrations need a moment.
          sleep 25
          xcrun simctl io "$UDID" screenshot shots/01-launch.png
          echo "Screenshot written:"; ls -la shots/

      - name: Did it stay up, and did it make a journal?
        run: |
          set -euo pipefail
          CONTAINER="$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)"
          echo "Container: $CONTAINER"
          echo "::group::what the app wrote"
          find "$CONTAINER" -type f -not -path '*/Caches/*' | head -60
          echo "::endgroup::"

          CRASHES="$(ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i ember || true)"
          if [ -n "$CRASHES" ]; then
            echo "Ember left a crash report:"
            echo "$CRASHES"
            cat ~/Library/Logs/DiagnosticReports/*[Ee]mber* 2>/dev/null | head -80 || true
            exit 1
          fi

          DB="$(find "$CONTAINER" -name 'ember.db' | head -1)"
          if [ -z "$DB" ]; then
            echo "No ember.db: the app started but never opened its journal."
            exit 1
          fi
          echo "Journal: $DB"
          echo "DB=$DB" >> "$GITHUB_ENV"
          echo "::group::tables the migrations created"
          sqlite3 "$DB" ".tables"
          echo "::endgroup::"
          # 14 migrations in src-tauri/src/lib.rs; the plugin records each one.
          APPLIED="$(sqlite3 "$DB" "SELECT COUNT(*) FROM _sqlx_migrations" 2>/dev/null || echo 0)"
          echo "Migrations applied: $APPLIED"
          test "$APPLIED" -eq 14
          # The tables the iPhone-only code writes to must exist.
          sqlite3 "$DB" "SELECT COUNT(*) FROM captures; SELECT COUNT(*) FROM checkins;" > /dev/null

      # The widget, the share sheet and a reminder answered on the lock screen
      # all reach the journal the same way: one JSON line in a file the app
      # drains when it next opens (src/inbox.ts). No extension exists yet, but
      # the file is the whole interface - so writing one by hand and reopening
      # Ember tests the entire path: Rust reads and empties it, TypeScript
      # parses it, and the note lands in the captures table.
      - name: A note left while Ember was closed reaches the journal
        run: |
          set -euo pipefail
          CONTAINER="$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)"
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          AT="$(python3 -c "import datetime;print(datetime.datetime.now().astimezone().isoformat(timespec='milliseconds'))")"
          LINE="{\"v\":1,\"kind\":\"note\",\"at\":\"$AT\",\"text\":\"a note from outside the app\"}"
          echo "Inbox line: $LINE"

          # inbox_path() uses app_data_dir; ember.db sits in app_config_dir.
          # On iOS those may or may not be the same folder, so write the line
          # to every plausible one - a stray copy is simply never read.
          DBDIR="$(dirname "$DB")"
          for DIR in "$DBDIR" "$CONTAINER/Library/Application Support/$BUNDLE_ID" "$CONTAINER/Documents"; do
            mkdir -p "$DIR" 2>/dev/null || continue
            echo "$LINE" > "$DIR/inbox.jsonl"
            echo "wrote $DIR/inbox.jsonl"
          done

          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          # Longer than the first launch: the screenshot is taken after the
          # launch crossfade has finished, not during it.
          sleep 40
          xcrun simctl io "$UDID" screenshot shots/02-after-inbox.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          echo "::group::captures"
          sqlite3 "$DB" "SELECT id, created_at, text FROM captures;"
          echo "::endgroup::"
          FOUND="$(sqlite3 "$DB" "SELECT COUNT(*) FROM captures WHERE text = 'a note from outside the app';")"
          echo "Notes that arrived: $FOUND"
          test "$FOUND" -eq 1
          # And the inbox was emptied, so the note can't be saved twice.
          for DIR in "$DBDIR" "$CONTAINER/Library/Application Support/$BUNDLE_ID" "$CONTAINER/Documents"; do
            if [ -s "$DIR/inbox.jsonl" ]; then
              echo "$DIR/inbox.jsonl still has something in it:"
              cat "$DIR/inbox.jsonl"
            fi
          done

      # The last mechanical link, as far as a build server can follow it.
      #
      # Every other test wrote the inbox into the app's own folder, which is
      # the fallback Ember uses when there is no App Group. This one goes for
      # the real thing: the App Group folder, which an extension can reach and
      # the app cannot find by guessing. If the note arrives from there, then
      # the entitlement is real, EmberBootstrap.mm's +load ran before main()
      # and set EMBER_INBOX_PATH, and Rust read it.
      #
      # A simulator may simply not create the container: App Groups are
      # normally handed out by a provisioning profile, and there isn't one
      # here. That isn't a failure of the port, so the step says so and moves
      # on rather than going red — but it does say so, every run, instead of
      # leaving the question open.
      - name: Does a note come through the App Group?
        run: |
          set -euo pipefail
          echo "::group::App Group containers this simulator knows about"
          xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" groups || true
          DEVICE=~/Library/Developer/CoreSimulator/Devices/"$UDID"
          ls -la "$DEVICE/data/Containers/Shared/AppGroup" 2>/dev/null || echo "(no shared app-group folder)"
          echo "::endgroup::"

          GROUP="$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" group.dev.abhij.ember.ios 2>/dev/null || true)"
          if [ -z "$GROUP" ] || [ ! -d "$GROUP" ]; then
            echo "NOT PROVEN: this simulator has no container for group.dev.abhij.ember.ios."
            echo "An App Group is granted by a provisioning profile, and an unsigned"
            echo "simulator build has none. Ember falls back to its own folder, which is"
            echo "why the earlier test still passed. On a device, with a profile that"
            echo "grants the group, this is the path a note from the widget or the share"
            echo "sheet takes. It stays on the by-hand checklist in BUILDING-ON-A-MAC.md."
            exit 0
          fi

          echo "App Group container: $GROUP"
          CONTAINER="$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)"
          DBDIR="$(dirname "$DB")"
          # Nothing left over anywhere else, so only the App Group can explain it.
          rm -f "$DBDIR/inbox.jsonl" "$CONTAINER/Library/Application Support/$BUNDLE_ID/inbox.jsonl" "$CONTAINER/Documents/inbox.jsonl"

          AT="$(python3 -c "import datetime;print(datetime.datetime.now().astimezone().isoformat(timespec='milliseconds'))")"
          LINE="{\"v\":1,\"kind\":\"note\",\"at\":\"$AT\",\"text\":\"a note through the app group\"}"
          echo "$LINE" > "$GROUP/inbox.jsonl"

          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 30
          xcrun simctl io "$UDID" screenshot shots/03-app-group.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          echo "::group::captures"
          sqlite3 "$DB" "SELECT id, text FROM captures;"
          echo "::endgroup::"
          FOUND="$(sqlite3 "$DB" "SELECT COUNT(*) FROM captures WHERE text = 'a note through the app group';")"
          echo "Notes that came through the App Group: $FOUND"
          test "$FOUND" -eq 1

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-ios-screenshots
          path: shots/
          if-no-files-found: warn
          retention-days: 14

      - name: Keep the unsigned app and the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-ios-unsigned
          path: |
            src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn
          retention-days: 14
