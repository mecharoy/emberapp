[package]
name = "ember-ios"
version = "1.5.3"
description = "Ember for iPhone - a journal that writes itself"
authors = ["Ember"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name from clashing with the binary name.
name = "ember_ios_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# tauri-plugin-http bundles its own TLS roots, so HTTPS works on iOS as is.
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keeping the API keys out of iCloud: the "don't back this up" mark is an
# extended attribute, set with setxattr.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
